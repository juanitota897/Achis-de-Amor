name = "achis-de-amor-worker"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Cloudflare Workers AI binding (free tier: 10K neurons/day, includes Flux image gen)
[ai]
binding = "AI"

[vars]
# Production tip: replace with "https://juanitota897.github.io" for security.
ALLOWED_ORIGIN = "*"

# Secrets (set via `wrangler secret put`):
#   ANTHROPIC_API_KEY  — required (for prompt building, pattern cleaning, vision)
#   OPENAI_API_KEY     — optional (only if you want to use DALL-E instead of Flux)
